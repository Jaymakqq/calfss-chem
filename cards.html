<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept Cards | CALFSS CHEM</title>
<!-- KaTeX -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
  :root{--cream:#f5efe2;--ink:#17140d;--muted:#6b6557;--line:#e5ddcb;--teal:#12b3a4;--coral:#ff5b57;--mustard:#ffc531;--violet:#6b5be6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang HK","Noto Sans HK",sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
  nav{
    position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
    padding:14px 28px;background:rgba(245,239,226,.9);backdrop-filter:blur(14px);border-bottom:3px solid var(--ink);
  }
  .logo{font-weight:900;font-size:1.15rem;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px}
  .logo-img{height:34px;width:auto;display:block}
  .logo em{font-style:normal;color:var(--violet)}
  .navlinks{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .navlinks a{text-decoration:none;color:var(--ink);font-size:.82rem;padding:8px 14px;border-radius:999px;font-weight:700;transition:.15s}
  .navlinks a:hover{background:var(--mustard)}.navlinks a.on{background:var(--ink);color:#fff}

  .page-head{padding:50px 28px 10px;max-width:800px;margin:0 auto}
  .page-head h1{font-size:clamp(1.8rem,5vw,3rem);font-weight:900;letter-spacing:-1.5px}

  .wrap{display:flex;gap:26px;max-width:1100px;margin:0 auto;padding:14px 28px 40px;align-items:flex-start}
  .toc{width:240px;flex-shrink:0;position:sticky;top:80px}
  .toc button{
    display:block;width:100%;text-align:left;background:none;border:none;padding:9px 14px;
    font-size:.83rem;color:var(--muted);border-radius:10px;cursor:pointer;font-weight:600;transition:.12s;
  }
  .toc button:hover{background:#efece5;color:var(--ink)}
  .toc button.on{background:var(--ink);color:#fff}
  .toc .all{font-weight:800;color:var(--ink)}
  .list{flex:1;display:grid;gap:14px;min-width:0}
  .deck-card{
    display:flex;gap:16px;align-items:center;background:#fff;border:3px solid var(--ink);
    border-radius:16px;padding:18px 20px;text-decoration:none;color:var(--ink);transition:.15s;cursor:pointer;
    box-shadow:6px 6px 0 var(--ink);
  }
  .deck-card:hover{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--ink)}
  .deck-card .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:1.25rem;flex-shrink:0;background:#e6e3ff}
  .deck-card .t{font-weight:800;font-size:.95rem}
  .deck-card .s{font-size:.76rem;color:var(--muted);margin-top:3px}
  .deck-card .go{margin-left:auto;color:var(--muted);font-weight:800}
  .empty{text-align:center;padding:70px 24px;color:var(--muted);background:#fff;border:1.5px dashed var(--line);border-radius:20px}
  .empty .big{font-size:3rem;margin-bottom:12px}
  .back-btn{
    display:inline-block;margin-bottom:16px;padding:8px 16px;border-radius:999px;
    background:#fff;border:3px solid var(--ink);font-weight:800;font-size:.82rem;
    cursor:pointer;box-shadow:4px 4px 0 var(--ink);text-decoration:none;color:var(--ink);
  }

  .game{max-width:600px;margin:20px auto;padding:0 20px 60px;text-align:center}
  .stats{display:flex;justify-content:center;gap:30px;font-size:.9rem;font-weight:700;margin-bottom:18px}
  .stats .n{font-size:1.5rem;color:var(--ink)}
  .stats .c .n{color:var(--teal)}.stats .w .n{color:var(--coral)}
  .stats .r .n{color:var(--violet)}

  .card-wrap{perspective:1200px;margin:0 auto 24px;cursor:pointer}
  .card-inner{
    position:relative;width:100%;padding-bottom:66%;transition:transform .5s cubic-bezier(.2,.9,.4,1.1);
    transform-style:preserve-3d;
  }
  .card-wrap.flipped .card-inner{transform:rotateX(180deg)}
  .card-face{
    position:absolute;top:0;left:0;width:100%;height:100%;
    border:3px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 var(--ink);
    padding:32px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    backface-visibility:hidden;overflow:hidden;
  }
  .card-front{background:#fff;z-index:2}
  .card-front .label{font-size:.7rem;font-weight:800;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}
  .card-front .q{font-size:clamp(1.05rem,3vw,1.35rem);font-weight:700;line-height:1.6;max-width:90%}
  .card-back{background:var(--teal);color:#fff;transform:rotateX(180deg)}
  .card-back .a{font-size:clamp(1rem,2.8vw,1.3rem);line-height:1.7;max-width:90%;font-weight:600}
  .hint{font-size:.78rem;color:var(--muted);margin-bottom:8px}

  .btn-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:6px}
  .btn{
    padding:12px 28px;border-radius:14px;font-weight:800;font-size:.9rem;
    border:3px solid var(--ink);cursor:pointer;transition:.12s;box-shadow:6px 6px 0 var(--ink);background:#fff;
  }
  .btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
  .btn-correct{background:var(--teal);color:#fff}
  .btn-wrong{background:var(--coral);color:#fff}
  .btn-next{background:var(--ink);color:#fff}
  .btn-shuffle{margin-top:30px;background:var(--mustard);color:var(--ink);display:inline-block}
  .btn-hof{margin-top:30px;background:var(--violet);color:#fff;display:inline-block;margin-left:10px}

  /* 排行榜 panel */
  .hof{
    position:fixed;inset:0;background:rgba(23,20,13,.6);z-index:100;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .hof.open{display:flex}
  .hof-box{
    background:#fff;border:3px solid var(--ink);border-radius:22px;
    box-shadow:8px 8px 0 var(--ink);padding:26px 24px;width:100%;max-width:440px;
    max-height:80vh;overflow-y:auto;
  }
  .hof-box h2{margin:0 0 6px;font-size:1.2rem;text-align:center}
  .hof-sub{text-align:center;font-size:.75rem;color:var(--muted);margin-bottom:14px}
  .hof-list{list-style:none;padding:0;margin:0}
  .hof-list li{
    display:flex;align-items:center;gap:10px;padding:10px 12px;
    border-bottom:2px dashed var(--line);font-size:.88rem;
  }
  .hof-list li:last-child{border:none}
  .hof-rank{font-weight:900;width:28px;text-align:center;flex-shrink:0}
  .hof-rank.top{color:var(--coral);font-size:1.1rem}
  .hof-name{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hof-deck{font-size:.72rem;color:var(--muted)}
  .hof-score{font-weight:900;color:var(--teal);flex-shrink:0}
  .hof-close{
    display:block;margin:18px auto 0;padding:10px 28px;border-radius:12px;
    border:3px solid var(--ink);background:var(--ink);color:#fff;font-weight:800;cursor:pointer;
  }
  .hof-empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:.9rem}

  .empty{text-align:center;padding:80px 20px;color:var(--muted)}
  .empty .big{font-size:4rem;margin-bottom:14px}

  @media(max-width:560px){
    nav{padding:10px 14px}
    .wrap{flex-direction:column;padding:10px 14px 30px}
    .toc{width:100%;position:static;display:flex;flex-wrap:wrap;gap:6px}
    .toc button{width:auto;padding:8px 12px;font-size:.78rem}
    .card-face{padding:20px 16px}
    .card-front .q{font-size:1rem}
    .stats{gap:16px;font-size:.8rem}
  }
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html"><img src="assets/MWK_logo.png" alt="MWK" class="logo-img">CALFSS<em>CHEM</em></a>
  <div class="navlinks">
    <a href="sims.html">🧪 模擬器</a>
    <a href="notes.html">📓 溫習筆記</a>
    <a href="games.html">🎮 小遊戲</a>
    <a href="cards.html" class="on">🃏 Concept Cards</a>
  </div>
</nav>

<div class="page-head"><h1>🃏 Concept Cards</h1></div>
<div class="wrap">
  <div class="toc" id="toc"></div>
  <div class="list" id="list"></div>
</div>
<div class="game" id="game" style="display:none"></div>

<!-- 排行榜 panel -->
<div class="hof" id="hofPanel">
  <div class="hof-box">
    <h2>🏆 排行榜</h2>
    <div class="hof-sub">全班同學最高分頭 20 次</div>
    <ul class="hof-list" id="hofList"></ul>
    <button class="hof-close" onclick="document.getElementById('hofPanel').classList.remove('open')">關閉</button>
  </div>
</div>

<script src="cards/cards.js"></script>
<script>
  let cards = [];
  let currentIdx = 0;
  let correct = 0, wrong = 0;
  let totalCards = 0;
  let flipped = false;
  let currentDeck = null;
  let topic = 'all';

  const toc = document.getElementById('toc');
  const listEl = document.getElementById('list');
  const gameEl = document.getElementById('game');
  const wrapEl = document.querySelector('.wrap');

  function renderToc() {
    const used = new Set(CARD_DECKS.map(d => d.topic));
    toc.innerHTML = `<button class="all ${topic==='all'?'on':''}" data-t="all">📚 全部卡組（${CARD_DECKS.length}）</button>`
      + CARD_TOPICS.filter(t => used.has(t)).map(t =>
        `<button class="${topic===t?'on':''}" data-t="${t}">${t}</button>`).join('');
    toc.querySelectorAll('button').forEach(b => b.onclick = () => { topic = b.dataset.t; renderToc(); renderList(); });
  }

  function renderList() {
    const arr = CARD_DECKS.filter(d => topic === 'all' || d.topic === topic);
    if (!arr.length) {
      listEl.innerHTML = `<div class="empty"><div class="big">🃏</div><b>呢個單元仲未有卡組</b><br><small>遲下會新增</small></div>`;
      return;
    }
    listEl.innerHTML = arr.map(d => `
      <a class="deck-card" data-id="${d.id}">
        <div class="ic">${d.emoji}</div>
        <div><div class="t">${d.title}</div><div class="s">${d.topic}</div></div>
        <div class="go">▶</div>
      </a>`).join('');
    listEl.querySelectorAll('.deck-card').forEach(c => c.addEventListener('click', () => loadDeck(c.dataset.id)));
  }

  async function loadDeck(id) {
    const deck = CARD_DECKS.find(d => d.id === id);
    if (!deck) return;
    currentDeck = id;
    renderToc();

    try {
      const res = await fetch('cards/' + deck.file);
      const csv = await res.text();
      const lines = csv.trim().split('\n').filter(l => l.trim());
      cards = lines.map(l => {
        const idx = l.indexOf(',');
        return { q: l.slice(0, idx).trim(), a: l.slice(idx + 1).trim() };
      }).filter(c => c.q && c.a);
      totalCards = cards.length;
      correct = 0; wrong = 0; flipped = false; currentIdx = 0;
      shuffle(cards);
      wrapEl.style.display = 'none';
      gameEl.style.display = 'block';
      renderGame();
      showCard();
    } catch(e) {
      gameEl.innerHTML = `<a class="back-btn" onclick="backToList()">← 返回目錄</a><div class="empty"><div class="big">❌</div><b>載入失敗</b><br><small>${e.message}</small></div>`;
    }
  }

  function backToList() {
    wrapEl.style.display = 'flex';
    gameEl.style.display = 'none';
    gameEl.innerHTML = '';
    renderList();
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function renderGame() {
    if (!totalCards) return;
    gameEl.innerHTML = `
      <div class="stats">
        <div class="c">✅ 正確 <div class="n" id="correct">${correct}</div></div>
        <div class="w">❌ 錯誤 <div class="n" id="wrong">${wrong}</div></div>
        <div class="r">📊 答對率 <div class="n" id="rate">${correct+wrong > 0 ? Math.round(correct/(correct+wrong)*100) : 0}%</div></div>
      </div>
      <a class="back-btn" onclick="backToList()" style="margin-bottom:14px">← 返回目錄</a>
      <div class="card-wrap" id="cardWrap">
        <div class="card-inner">
          <div class="card-face card-front">
            <div class="label">❓ 問題</div>
            <div class="q" id="question"></div>
          </div>
          <div class="card-face card-back">
            <div class="a" id="answer"></div>
          </div>
        </div>
      </div>
      <div class="hint" id="hint">🖱️ 撳張卡睇答案</div>
      <div style="font-size:.82rem;color:var(--muted);margin-bottom:14px" id="progress"></div>
      <div class="btn-row" id="btnRow">
        <button class="btn btn-correct" id="btnCorrect">✅ 正確</button>
        <button class="btn btn-wrong" id="btnWrong">❌ 錯誤</button>
        <button class="btn btn-next" id="btnNext">下一張 →</button>
      </div>
      <button class="btn btn-shuffle" id="btnShuffle">🔀 重新洗牌</button>
      <button class="btn btn-hof" id="btnHof">🏆 排行榜</button>
    `;
    document.getElementById('btnCorrect').addEventListener('click', () => mark(true));
    document.getElementById('btnWrong').addEventListener('click', () => mark(false));
    document.getElementById('btnNext').addEventListener('click', nextCard);
    document.getElementById('btnShuffle').addEventListener('click', () => { shuffle(cards); currentIdx = 0; flipped = false; showCard(); });
    document.getElementById('cardWrap').addEventListener('click', toggleFlip);
    document.getElementById('btnHof').addEventListener('click', openHof);
    document.addEventListener('keydown', keyHandler);
  }

  function keyHandler(e) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleFlip(); }
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); nextCard(); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prevCard(); }
  }

  function toggleFlip() {
    const wrap = document.getElementById('cardWrap');
    if (!wrap) return;
    flipped = !flipped;
    wrap.classList.toggle('flipped', flipped);
    document.getElementById('hint').textContent = flipped ? '💡 答案顯示中' : '🖱️ 撳張卡睇答案';
  }

  function showCard() {
    if (!cards.length) return;
    if (currentIdx >= cards.length) { currentIdx = 0; shuffle(cards); }
    const card = cards[currentIdx];
    document.getElementById('question').textContent = card.q;
    document.getElementById('answer').textContent = card.a;
    // render $...$ with KaTeX
    if (window.renderMathInElement) {
      try { renderMathInElement(document.getElementById('question'), {delimiters:[{left:'$',right:'$',display:false}],throwOnError:false}); } catch(e){}
      try { renderMathInElement(document.getElementById('answer'), {delimiters:[{left:'$',right:'$',display:false}],throwOnError:false}); } catch(e){}
    }
    document.getElementById('progress').textContent = `${currentIdx + 1} / ${totalCards}`;
    const wrap = document.getElementById('cardWrap');
    if (wrap) wrap.classList.remove('flipped');
    flipped = false;
    document.getElementById('hint').textContent = '🖱️ 撳張卡睇答案';
  }

  function mark(isCorrect) {
    if (isCorrect) { correct++; } else { wrong++; }
    const total = correct + wrong;
    document.getElementById('correct').textContent = correct;
    document.getElementById('wrong').textContent = wrong;
    document.getElementById('rate').textContent = total > 0 ? Math.round(correct/total*100) + '%' : '0%';
    // disable buttons until next card
    document.getElementById('btnCorrect').disabled = true;
    document.getElementById('btnWrong').disabled = true;
  }

  function nextCard() {
    currentIdx++;
    if (currentIdx >= cards.length) {
      const total = correct + wrong;
      const pct = total > 0 ? Math.round(correct/total*100) : 0;
      const deck = CARD_DECKS.find(d => d.id === currentDeck);
      const deckName = deck ? deck.title : currentDeck;
      const name = prompt(`🎉 完成呢副牌！\n✅ 正確: ${correct}\n❌ 錯誤: ${wrong}\n📊 答對率: ${pct}%\n\n想上榜？輸入你嘅名（留空取消）：`);
      if (name && name.trim()) {
        saveScore(name.trim().slice(0, 20), deckName, correct, total, pct);
      }
      shuffle(cards);
      currentIdx = 0;
      correct = 0; wrong = 0;
    }
    document.getElementById('btnCorrect').disabled = false;
    document.getElementById('btnWrong').disabled = false;
    showCard();
  }

  // ---- 排行榜 (Google Apps Script + localStorage fallback) ----
  const API_URL = 'https://script.google.com/macros/s/AKfycbzuWmyWHb77WDuwVj8iUVKCTGtbJdsKYT_jvL-N-7wVkbnzE6TGRNIC4jW-admeTxBT/exec';
  const HOF_KEY = 'calfss_hof';

  function getLocalHof() {
    try { return JSON.parse(localStorage.getItem(HOF_KEY)) || []; }
    catch(e) { return []; }
  }
  function saveLocal(name, deck, corr, tot, rate) {
    const hof = getLocalHof();
    hof.push({ name, deck, corr, tot, rate });
    hof.sort((a,b) => b.rate - a.rate || b.corr - a.corr);
    localStorage.setItem(HOF_KEY, JSON.stringify(hof.slice(0, 20)));
  }
  function saveScore(name, deck, corr, tot, rate) {
    saveLocal(name, deck, corr, tot, rate);
    fetch(API_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({name, deck, correct: corr, total: tot, rate})
    }).catch(() => {});
  }
  async function openHof() {
    const list = document.getElementById('hofList');
    list.innerHTML = '<div class="hof-empty">載入中…</div>';
    document.getElementById('hofPanel').classList.add('open');
    let hof = [];
    try {
      const res = await fetch(API_URL);
      hof = await res.json();
      if (!Array.isArray(hof)) hof = [];
    } catch(e) {
      hof = getLocalHof();
    }
    if (!hof.length) {
      list.innerHTML = '<div class="hof-empty">🎮 仲未有紀錄<br><small>玩完一副牌之後就會上榜！</small></div>';
    } else {
      list.innerHTML = hof.map((h, i) => `
        <li>
          <span class="hof-rank ${i < 3 ? 'top' : ''}">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i+1)}</span>
          <div style="flex:1;min-width:0">
            <div class="hof-name">${h.name}</div>
            <div class="hof-deck">${h.deck}</div>
          </div>
          <span class="hof-score">${h.corr ?? h.correct}/${h.tot ?? h.total} · ${h.rate}%</span>
        </li>`).join('');
    }
  }

  function prevCard() {
    if (currentIdx > 0) { currentIdx--; showCard(); }
  }

  renderToc();
  renderList();
</script>
</body>
</html>
