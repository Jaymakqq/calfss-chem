<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>互動模擬器 | CALFSS CHEM</title>
<style>
  :root{
    --cream:#faf8f4; --ink:#1a1a1a; --muted:#6b6b66; --line:#e8e4dc;
    --blue:#2f6fed; --green:#1d9e6b; --phys:#d6499e; --bio:#d99a1d; --is:#6a56d8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;
       background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased}

  nav{
    position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
    padding:16px 28px;background:rgba(250,248,244,.88);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .logo{font-weight:900;font-size:1.15rem;letter-spacing:-.5px;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px}
  .logo-img{height:34px;width:auto;display:block}
  .logo em{font-style:normal;color:var(--blue)}
  .navlinks{display:flex;gap:6px;flex-wrap:wrap}
  .navlinks a{text-decoration:none;color:var(--muted);font-size:.82rem;padding:8px 14px;border-radius:999px;transition:.15s;font-weight:600}
  .navlinks a:hover,.navlinks a.on{background:var(--ink);color:#fff}

  .page-head{padding:64px 28px 30px;max-width:1100px;margin:0 auto}
  .page-head h1{font-size:clamp(2rem,5.5vw,3.4rem);font-weight:900;letter-spacing:-2px}
  .page-head p{color:var(--muted);margin-top:10px;max-width:560px;line-height:1.7;font-size:.95rem}

  .toolbar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    padding:0 28px 26px;max-width:1100px;margin:0 auto;
  }
  .search{
    flex:1 1 240px;max-width:400px;display:flex;align-items:center;gap:8px;
    background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:10px 18px;
  }
  .search input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:.9rem}
  .chip{
    padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;
    color:var(--muted);font-size:.8rem;font-weight:700;cursor:pointer;transition:.15s;user-select:none;
  }
  .chip:hover{border-color:var(--ink);color:var(--ink)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

  .grid{
    display:grid;gap:18px;padding:0 28px 70px;max-width:1100px;margin:0 auto;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  }
  .card{
    background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:24px;
    display:flex;flex-direction:column;gap:12px;transition:.18s;text-decoration:none;color:inherit;
  }
  .card:hover{transform:translateY(-4px);border-color:var(--ink);box-shadow:0 14px 34px rgba(0,0,0,.08)}
  .card .top{display:flex;align-items:center;gap:14px}
  .card .icon{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:1.6rem;flex-shrink:0}
  .card h2{font-size:1.02rem;font-weight:900;letter-spacing:-.3px;line-height:1.3}
  .card .en{font-size:.72rem;color:var(--muted);font-weight:600}
  .card .desc{font-size:.82rem;color:#4b4b46;line-height:1.65;flex:1}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:.66rem;font-weight:700;padding:3px 10px;border-radius:999px;background:#f3f0ea;color:var(--muted)}
  .tag.subj{background:#e3edff;color:var(--blue)}
  .open{
    margin-top:2px;text-align:center;padding:12px;border-radius:12px;font-size:.86rem;font-weight:800;
    background:var(--ink);color:#fff;transition:.15s;
  }
  .card:hover .open{background:var(--blue)}
  .empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}
  .empty .big{font-size:3rem;margin-bottom:10px}

  footer{border-top:1px solid var(--line);padding:26px 28px;text-align:center;color:var(--muted);font-size:.75rem}
  footer a{color:var(--muted);font-weight:700;text-decoration:none}
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html"><img src="assets/MWK_logo.png" alt="MWK" class="logo-img">CALFSS<em>CHEM</em></a>
  <div class="navlinks">
    <a href="sims.html" class="on">🧪 模擬器</a>
    <a href="notes.html">📓 溫習筆記</a>
    <a href="games.html">🎮 小遊戲</a>
    <a href="cards.html">🃏 Concept Cards</a>
  </div>
</nav>

<div class="page-head">
  <h1>互動模擬器 🧪</h1>
  <p>親手操作化學反應：微觀粒子動畫、3D 分子模型、虛擬實驗室。全部喺瀏覽器即開即用，手機都玩到。</p>
</div>

<div class="toolbar">
  <div class="search">🔍 <input id="q" placeholder="搜尋模擬器（例如：聚合、滴定、limiting…）"></div>
  <div class="chip on" data-s="all">全部</div>
  <div class="chip" data-s="chemistry">化學</div>
  <div class="chip" data-s="physics">物理</div>
  <div class="chip" data-s="biology">生物</div>
  <div class="chip" data-s="is">綜合科學</div>
</div>

<div class="grid" id="grid"></div>

<footer>← <a href="index.html">返回首頁</a> · Made with ❤️ by Mr. Mak</footer>

<script src="sims.js"></script>
<script>
const grid=document.getElementById('grid');
let subject='all',kw='';
const SUBJ_NAME={chemistry:'化學',physics:'物理',biology:'生物',is:'綜合科學'};
const LEVEL_NAME={junior:'初中',dse:'DSE',both:'初中 + DSE'};
const BG={chemistry:'#e3edff',physics:'#ffe3f1',biology:'#fff3d6',is:'#e6e3ff'};

function render(){
  const list=SIMS.filter(s=>{
    if(subject!=='all'&&s.subject!==subject)return false;
    if(kw){
      const hay=(s.title+s.titleEn+s.topic+s.desc+(s.tags||[]).join(' ')).toLowerCase();
      if(!hay.includes(kw))return false;
    }
    return true;
  });
  if(!list.length){
    grid.innerHTML='<div class="empty"><div class="big">🔭</div>搵唔到相關嘅模擬器<br><small>試下其他關鍵字</small></div>';
    return;
  }
  grid.innerHTML=list.map(s=>`
    <a class="card" href="sims/${s.id}/index.html" target="_blank">
      <div class="top">
        <div class="icon" style="background:${BG[s.subject]}">${s.emoji}</div>
        <div><h2>${s.title}</h2><div class="en">${s.titleEn}</div></div>
      </div>
      <div class="desc">${s.desc}</div>
      <div class="tags">
        <span class="tag subj">${SUBJ_NAME[s.subject]}</span>
        <span class="tag">${LEVEL_NAME[s.level]}</span>
        <span class="tag">${s.topic.split(' ')[0]}</span>
      </div>
      <div class="open">▶ 開啟模擬器</div>
    </a>`).join('');
}

document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
  c.classList.add('on');subject=c.dataset.s;render();
});
document.getElementById('q').oninput=e=>{kw=e.target.value.trim().toLowerCase();render();};
render();
</script>
</body>
</html>
