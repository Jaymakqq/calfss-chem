<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>溫習筆記 | CALFSS CHEM</title>
<style>
  :root{--cream:#faf8f4;--ink:#1a1a1a;--muted:#6b6b66;--line:#e8e4dc;--green:#1d9e6b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;
       background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased}
  nav{
    position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
    padding:16px 28px;background:rgba(250,248,244,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  }
  .logo{font-weight:900;font-size:1.15rem;letter-spacing:-.5px;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px}
  .logo-img{height:34px;width:auto;display:block}
  .logo em{font-style:normal;color:#2f6fed}
  .navlinks{display:flex;gap:6px;flex-wrap:wrap}
  .navlinks a{text-decoration:none;color:var(--muted);font-size:.82rem;padding:8px 14px;border-radius:999px;transition:.15s;font-weight:600}
  .navlinks a:hover,.navlinks a.on{background:var(--ink);color:#fff}

  .page-head{padding:64px 28px 30px;max-width:1100px;margin:0 auto}
  .page-head h1{font-size:clamp(2rem,5.5vw,3.4rem);font-weight:900;letter-spacing:-2px}
  .page-head p{color:var(--muted);margin-top:10px;max-width:560px;line-height:1.7;font-size:.95rem}

  .wrap{display:flex;gap:26px;max-width:1100px;margin:0 auto;padding:0 28px 80px;align-items:flex-start}
  .toc{width:250px;flex-shrink:0;position:sticky;top:80px}
  .toc button{
    display:block;width:100%;text-align:left;background:none;border:none;padding:9px 14px;
    font-size:.83rem;color:var(--muted);border-radius:10px;cursor:pointer;font-weight:600;transition:.12s;
  }
  .toc button:hover{background:#efece5;color:var(--ink)}
  .toc button.on{background:var(--ink);color:#fff}
  .toc .all{font-weight:800;color:var(--ink)}

  .list{flex:1;display:grid;gap:14px;min-width:0}
  .note{
    display:flex;gap:16px;align-items:center;background:#fff;border:1.5px solid var(--line);
    border-radius:16px;padding:18px 20px;text-decoration:none;color:var(--ink);transition:.15s;
  }
  .note:hover{border-color:var(--ink);transform:translateX(4px)}
  .note .ic{
    width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:1.25rem;
    flex-shrink:0;background:#e2f5ec;
  }
  .note .t{font-weight:800;font-size:.95rem}
  .note .s{font-size:.76rem;color:var(--muted);margin-top:3px;line-height:1.5}
  .note .badge{margin-left:auto;font-size:.66rem;font-weight:800;padding:4px 10px;border-radius:999px;flex-shrink:0}
  .b-pdf{background:#fde8e8;color:#c0392b}
  .b-md{background:#e3edff;color:#2f6fed}
  .note .go{color:var(--muted);font-weight:800;margin-left:6px}

  .empty{
    text-align:center;padding:70px 24px;color:var(--muted);background:#fff;
    border:1.5px dashed var(--line);border-radius:20px;
  }
  .empty .big{font-size:3rem;margin-bottom:12px}
  .empty code{background:#f3f0ea;padding:2px 8px;border-radius:6px;font-size:.8rem}

  @media(max-width:760px){.wrap{flex-direction:column}.toc{width:100%;position:static;display:flex;flex-wrap:wrap;gap:6px}.toc button{width:auto}}
  footer{border-top:1px solid var(--line);padding:26px 28px;text-align:center;color:var(--muted);font-size:.75rem}
  footer a{color:var(--muted);font-weight:700;text-decoration:none}
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html"><img src="assets/MWK_logo.png" alt="MWK" class="logo-img">CALFSS<em>CHEM</em></a>
  <div class="navlinks">
    <a href="sims.html">🧪 模擬器</a>
    <a href="notes.html" class="on">📓 溫習筆記</a>
    <a href="games.html">🎮 小遊戲</a>
    <a href="cards.html">🃏 Concept Cards</a>
  </div>
</nav>

<div class="page-head">
  <h1>溫習筆記 📓</h1>
  <p>按 DSE 化學科 12 個課題分類。PDF 筆記直接喺瀏覽器開啟，精簡版筆記適合手機快速重溫。</p>
</div>

<div class="wrap">
  <div class="toc" id="toc"></div>
  <div class="list" id="list"></div>
</div>

<footer>← <a href="index.html">返回首頁</a> · Made with ❤️ by Mr. Mak</footer>

<script src="notes/notes.js"></script>
<script>
let topic='all';
const toc=document.getElementById('toc'),list=document.getElementById('list');

function renderToc(){
  const used=new Set(NOTES.map(n=>n.topic));
  toc.innerHTML=`<button class="all ${topic==='all'?'on':''}" data-t="all">📚 全部筆記（${NOTES.length}）</button>`
    + DSE_TOPICS.filter(t=>used.has(t)).map(t=>
      `<button class="${topic===t?'on':''}" data-t="${t}">${t}</button>`).join('');
  toc.querySelectorAll('button').forEach(b=>b.onclick=()=>{topic=b.dataset.t;renderToc();renderList();});
}

function renderList(){
  const arr=NOTES.filter(n=>topic==='all'||n.topic===topic);
  if(!arr.length){
    list.innerHTML=`<div class="empty">
      <div class="big">📝</div>
      <b>筆記陸續上架中</b><br><br>
      <small>老師正在整理筆記，好快就有！<br>
      （有新 PDF 或 Markdown 筆記時，會加喺 <code>notes/notes.js</code>）</small>
    </div>`;
    return;
  }
  list.innerHTML=arr.map(n=>{
    const href = n.type==='pdf' ? `notes/${n.file}` : `notes/view.html?f=${encodeURIComponent(n.file)}`;
    return `<a class="note" href="${href}" target="_blank">
      <div class="ic">${n.type==='pdf'?'📄':'📝'}</div>
      <div><div class="t">${n.title}</div><div class="s">${n.topic}${n.desc?' · '+n.desc:''}</div></div>
      <span class="badge ${n.type==='pdf'?'b-pdf':'b-md'}">${n.type==='pdf'?'PDF':'精簡版'}</span>
      <div class="go">→</div>
    </a>`;
  }).join('');
}
renderToc();renderList();
</script>
</body>
</html>
