<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>化學小遊戲 | CALFSS CHEM</title>
<style>
  :root{--cream:#f5efe2;--ink:#17140d;--muted:#6b6557;--line:#e5ddcb;--teal:#12b3a4;--coral:#ff5b57}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased}
  nav{
    position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
    padding:14px 28px;background:rgba(245,239,226,.9);backdrop-filter:blur(14px);border-bottom:3px solid var(--ink);
  }
  .logo{font-weight:900;font-size:1.15rem;letter-spacing:-.5px;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px}
  .logo-img{height:34px;width:auto;display:block}
  .logo em{font-style:normal;color:#6b5be6}
  .navlinks{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .navlinks a{text-decoration:none;color:var(--ink);font-size:.82rem;padding:8px 14px;border-radius:999px;transition:.15s;font-weight:700}
  .navlinks a:hover{background:#ffc531}
  .navlinks a.on{background:var(--ink);color:#fff}

  .page-head{padding:60px 28px 24px;max-width:1100px;margin:0 auto}
  .page-head h1{font-size:clamp(2rem,5.5vw,3.4rem);font-weight:900;letter-spacing:-2px}
  .page-head p{color:var(--muted);margin-top:8px;max-width:560px;line-height:1.7;font-size:.95rem}

  .grid{display:grid;gap:20px;padding:0 28px 80px;max-width:1100px;margin:0 auto;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
  .card{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:8px 8px 0 var(--ink);transition:.15s;text-decoration:none;color:inherit}
  .card:hover{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--ink)}
  .card .top{display:flex;align-items:center;gap:14px}
  .card .icon{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:1.8rem;flex-shrink:0;border:3px solid var(--ink);background:var(--teal)}
  .card h2{font-size:1.08rem;font-weight:900;letter-spacing:-.3px}
  .card .en{font-size:.72rem;color:var(--muted);font-weight:600}
  .card .desc{font-size:.83rem;color:#4b4b46;line-height:1.65;flex:1}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:.66rem;font-weight:700;padding:3px 10px;border-radius:999px;background:#f3f0ea;color:var(--muted)}
  .play{text-align:center;padding:12px;border-radius:12px;font-size:.88rem;font-weight:800;border:3px solid var(--ink);background:var(--coral);color:#fff;box-shadow:5px 5px 0 var(--ink);transition:.12s}
  .card:hover .play{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}

  footer{border-top:1px solid var(--line);padding:26px 28px;text-align:center;color:var(--muted);font-size:.75rem}
  footer a{color:var(--muted);font-weight:700;text-decoration:none}
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html"><img src="assets/MWK_logo.png" alt="MWK" class="logo-img">CALFSS<em>CHEM</em></a>
  <div class="navlinks">
    <a href="sims.html">🧪 模擬器</a>
    <a href="notes.html">📓 溫習筆記</a>
    <a href="games.html" class="on">🎮 小遊戲</a>
    <a href="cards.html">🃏 Concept Cards</a>
  </div>
</nav>

<div class="page-head">
  <h1>化學小遊戲 🎮</h1>
  <p>玩住學化學！每個遊戲都融入 DSE 必考概念，開心溫習。</p>
</div>

<div class="grid" id="grid"></div>

<footer>← <a href="index.html">返回首頁</a> · Made with ❤️ by Mr. Mak</footer>

<script src="games/games.js"></script>
<script>
const grid=document.getElementById('grid');
function render(){
  grid.innerHTML=GAMES.map(g=>`
    <a class="card" href="games/${g.id}/index.html" target="_blank">
      <div class="top">
        <div class="icon">${g.emoji}</div>
        <div><h2>${g.title}</h2><div class="en">${g.titleEn}</div></div>
      </div>
      <div class="desc">${g.desc}</div>
      <div class="tags">
        <span class="tag">${g.topic}</span>
        <span class="tag">${g.level==='dse'?'DSE 高中':'初中'}</span>
      </div>
      <div class="play">▶ 開始遊戲</div>
    </a>`).join('');
}
render();
</script>
</body>
</html>
